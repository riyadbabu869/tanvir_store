<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>তানভীর ষ্টোর</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#333;
}

/* ব্যাকগ্রাউন্ড */
.watermark{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  overflow:hidden;
  z-index:-1;
  pointer-events:none;
}

.watermark span{
  display:inline-block;
  width:160px;
  height:55px;
  font-size:14px;
  color:rgba(100,70,40,0.08);
  transform:rotate(-20deg);
}

/* উপরের অংশ */
.header{
  background:#ffffff;
  padding:14px;
  box-shadow:0 2px 8px rgba(0,0,0,0.12);
  position:sticky;
  top:0;
  z-index:10;
}

.top{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

/* লোগো */
.logo{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:21px;
  font-weight:bold;
  color:#e85d04;
  white-space:nowrap;
}

.logo img{
  width:48px;
  height:48px;
  object-fit:cover;
  border-radius:50%;
  display:block;
}

/* সার্চ */
.search{
  flex:1;
  display:flex;
}

.search input{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:6px 0 0 6px;
  font-size:15px;
  outline:none;
}

.search button{
  border:0;
  background:#e85d04;
  color:white;
  padding:0 16px;
  border-radius:0 6px 6px 0;
}

/* মূল জায়গা */
.container{
  max-width:900px;
  margin:20px auto;
  padding:0 10px;
}

/* পার্স যোগ */
.add{
  background:white;
  padding:16px;
  border-radius:8px;
  margin-bottom:18px;
  box-shadow:0 2px 7px rgba(0,0,0,0.08);
}

.add h3{
  margin:0 0 12px;
}

.add input{
  width:100%;
  padding:11px;
  margin-bottom:8px;
  border:1px solid #ddd;
  border-radius:6px;
  font-size:15px;
}

.add button{
  width:100%;
  padding:11px;
  border:0;
  border-radius:6px;
  background:#e85d04;
  color:white;
  font-size:16px;
}

/* পার্সের তালিকা */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:white;
  border-radius:8px;
  padding:15px;
  box-shadow:0 2px 7px rgba(0,0,0,0.10);
}

.product-name{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.price{
  font-size:20px;
  font-weight:bold;
  color:#e85d04;
  margin-bottom:12px;
}

/* দাম বাড়ানো কমানো */
.controls{
  display:flex;
  align-items:center;
  gap:5px;
}

.controls button{
  border:0;
  width:40px;
  height:36px;
  border-radius:5px;
  background:#eeeeee;
  font-size:20px;
}

.controls span{
  flex:1;
  text-align:center;
  font-size:13px;
}

/* মুছে ফেলা */
.delete{
  margin-top:12px;
  width:100%;
  padding:8px;
  border:0;
  border-radius:5px;
  background:#f3dddd;
  color:#a00000;
}

/* মোবাইল */
@media(max-width:600px){
  .top{
    flex-wrap:wrap;
  }

  .logo{
    width:100%;
    text-align:center;
    justify-content:center;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .product-name{
    font-size:16px;
  }

  .price{
    font-size:18px;
  }
}

</style>
</head>

    </div>

    <div class="search">

      <input
        type="text"
        id="search"
        placeholder="পার্সের নাম খুঁজুন..."
        oninput="showProducts()"

      <button>🔍</button>

<div class="container">

  <!-- নতুন পার্স -->
  <div class="add">

    <h3>➕ নতুন পার্স যোগ করুন</h3>

    <input
      type="text"
      id="name"
      placeholder="পার্সের নাম"
    >

    <input
      type="number"
      id="price"
      placeholder="দাম"
    >

    <button onclick="addProduct()">
      পার্স যোগ করুন
    </button>

  </div>

  <!-- পার্সগুলো এখানে আসবে -->
  <div
    class="products"
    id="products">
  </div>

</div>

<script>

/* ব্যাকগ্রাউন্ডে অনেক তানভীর ষ্টোর */
let watermark =
document.getElementById("watermark");

for(let i=0;i<80;i++){
  let span =
  document.createElement("span");

  span.innerText="তানভীর ষ্টোর";

  watermark.appendChild(span);
}

/* আগের সেভ করা পার্স */
let products =
JSON.parse(
  localStorage.getItem("tanvirStore")
) || [];

/* তথ্য সেভ */
function save(){
  localStorage.setItem(
    "tanvirStore",
    JSON.stringify(products)
  );
}

/* নতুন পার্স যোগ */
function addProduct(){
  let name =
  document.getElementById("name")
  .value
  .trim();

  let price =
  Number(
    document.getElementById("price").value
  );

  if(name === ""){
    alert("পার্সের নাম লিখুন");
    return;
  }

  if(price <= 0){
    alert("সঠিক দাম লিখুন");
    return;
  }

  products.push({
    name:name,
    price:price
  });

  save();

  document.getElementById("name")
  .value="";

  document.getElementById("price")
  .value="";

  showProducts();
}

/* পার্স দেখানো */
function showProducts(){
  let box =
  document.getElementById("products");

  let search =
  document.getElementById("search")
  .value
  .toLowerCase();

  box.innerHTML="";

  products.forEach(
    function(product,index){
      if(
        !product.name
        .toLowerCase()
        .includes(search)
      ){
        return;
      }

      box.innerHTML += `
        <div class="card">

          <div class="product-name">
            ${product.name}
          </div>

          <div class="price">
            ৳ ${product.price}
          </div>

          <div class="controls">

            <button
              onclick="changePrice(${index},-10)">
              −
            </button>

            <span>
              দাম পরিবর্তন
            </span>

            <button
              onclick="changePrice(${index},10)">
              +
            </button>

          </div>

          <button
            class="delete"
            onclick="deleteProduct(${index})">
            🗑 মুছে ফেলুন
          </button>

        </div>
      `;
    }
  );
}

/* দাম পরিবর্তন */
function changePrice(index,amount){
  products[index].price += amount;

  if(products[index].price < 0){
    products[index].price=0;
  }

  save();
  showProducts();
}

/* পার্স মুছে ফেলা */
function deleteProduct(index){
  if(
    confirm("এই পার্সটি মুছে ফেলবেন?")
  ){
    products.splice(index,1);
    save();
    showProducts();
  }
}

/* ওয়েবসাইট চালু */
showProducts();

</script>

</body>
</html>
